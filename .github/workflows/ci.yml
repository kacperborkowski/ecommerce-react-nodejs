# Runs on every push to main and on every pull request.
# Three jobs run in parallel, each on a fresh Linux machine from GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Test-only database credentials: the database exists only inside the CI run
env:
  DATABASE_URL: postgres://shop:shop@localhost:5432/shop?sslmode=disable

jobs:
  backend:
    name: Backend (lint, unit and API tests)
    runs-on: ubuntu-latest

    # A PostgreSQL container next to the job, like docker-compose.yml locally
    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # The lockfiles are written by npm 11; Node 22 comes with npm 10
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # The seed script reads backend/.env, which isn't in the repository
      - run: echo "DATABASE_URL=$DATABASE_URL" > .env
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test:e2e

  frontend:
    name: Frontend (lint, type check, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      # tsc -b (type check) + vite build
      - run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - run: npm install -g npm@11

      - name: Install backend and prepare the database
        working-directory: backend
        run: |
          npm ci
          echo "DATABASE_URL=$DATABASE_URL" > .env
          npm run db:migrate
          npm run db:seed

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts the backend and the frontend itself (webServer)
      - name: Run Playwright tests
        working-directory: e2e
        run: npm test

      # After a failure, the HTML report with traces can be downloaded
      # from the run's summary page on GitHub
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
